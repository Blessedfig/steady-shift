# Builds the Android test app (an installable APK) from mobile/ and posts it to the "android-test" release,
# so testers can download it straight to a phone:
# https://github.com/Blessedfig/steady-shift/releases/download/android-test/steady-shift-test.apk
# The app opens the live test app, so normal app changes do not need a new build.
name: Android test build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", "app/icons/**", ".github/workflows/android-test.yml"]

permissions:
  contents: write

concurrency:
  group: android-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: npm ci
      - name: Create the Android project
        run: npx cap add android
      - name: App icons
        run: |
          RES=android/app/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26"
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir="$RES/mipmap-${d%%:*}"; size="${d##*:}"; mkdir -p "$dir"
            convert ../app/icons/icon-512.png -resize "${size}x${size}" "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            rm -f "$dir/ic_launcher_foreground.png"
          done
          # replace Capacitor's default splash logo with ours, centered on the app background
          for f in $(find "$RES" -name splash.png); do
            wh=$(identify -format "%wx%h" "$f"); w=${wh%x*}; h=${wh#*x}; m=$(( (w<h?w:h) / 3 ))
            convert -size "$wh" xc:'#F5F9FC' \( ../app/icons/icon-512.png -resize "${m}x${m}" \) -gravity center -composite "$f"
          done
      - name: Build the APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk steady-shift-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: steady-shift-test-apk
          path: mobile/steady-shift-test.apk
      - name: Post to the android-test release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-test >/dev/null 2>&1 || gh release create android-test --prerelease --title "Android test app" --notes "Test build of the Steady Shift app for Android. On your phone, download steady-shift-test.apk, open it, and allow installing from your browser when asked. It opens the live test app, so you only need to install it once."
          gh release upload android-test steady-shift-test.apk --clobber
