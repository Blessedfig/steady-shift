<path d="M146 190 L160 222 L174 190Z" fill="#FFFFFF"/>
<circle cx="160" cy="236" r="3" fill="#C98A4B"/><circle cx="160" cy="256" r="3" fill="#C98A4B"/><circle cx="160" cy="276" r="3" fill="#C98A4B"/>
