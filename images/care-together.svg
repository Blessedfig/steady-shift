<path d="M96 272 Q160 258 234 272 Q244 300 232 324 Q160 336 98 324 Q86 300 96 272Z" fill="#FFFFFF"/>
<path d="M100 286 l10 -6 l10 6 l10 -6 l10 6 l10 -6 l10 6 l10 -6 l10 6 l10 -6 l10 6 l10 -6 l10 6 l10 -6" stroke="#BFDCF2" stroke-width="3" fill="none" stroke-linejoin="round"/>
<path d="M100 308 l10 -6 l10 6 l10 -6 l10 6 l10 -6 l10 6 l10 -6 l10 6 l10 -6 l10 6 l10 -6 l10 6 l10 -6" stroke="#F6C98B" stroke-width="3" fill="none" stroke-linejoin="round"/>
<!-- neck and head -->
<rect x="150" y="164" width="22" height="28" rx="10" fill="#E8B48D"/>
<circle cx="162" cy="140" r="33" fill="#F3CDA9"/>
<path d="M130 142 Q124 104 162 102 Q200 104 196 140 Q190 120 164 118 Q140 120 132 146Z" fill="#E9E7F0"/>
<circle cx="188" cy="108" r="13" fill="#E9E7F0"/>
