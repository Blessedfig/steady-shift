<path d="M337 234 q-6 -14 -12 -20 M337 234 q2 -16 4 -24 M337 234 q8 -12 14 -16" stroke="#4FA07A" stroke-width="2" fill="none"/>
<circle cx="325" cy="213" r="5" fill="#F2A99A"/><circle cx="341" cy="209" r="5" fill="#F6C98B"/><circle cx="351" cy="217" r="5" fill="#F2A99A"/>

