<rect x="226" y="232" width="50" height="102" rx="24" fill="url(#chairArm)"/>
<rect x="86" y="326" width="10" height="18" rx="4" fill="#6E8FA8"/><rect x="224" y="326" width="10" height="18" rx="4" fill="#6E8FA8"/>

