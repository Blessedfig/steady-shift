<!-- glasses, closed happy eyes, smile -->
<circle cx="166" cy="142" r="8" fill="none" stroke="#8E7A6A" stroke-width="2"/><circle cx="186" cy="142" r="8" fill="none" stroke="#8E7A6A" stroke-width="2"/>
<path d="M174 142 h4" stroke="#8E7A6A" stroke-width="2"/>
<path d="M162 143 q4 -4 8 0 M182 143 q4 -4 8 0" stroke="#6B3E26" stroke-width="2.4" fill="none" stroke-linecap="round"/>
<path d="M172 156 q7 6 14 0" stroke="#6B3E26" stroke-width="2.6" fill="none" stroke-linecap="round"/>
<circle cx="194" cy="153" r="5" fill="#F2A99A" opacity=".7"/><circle cx="158" cy="154" r="5" fill="#F2A99A" opacity=".6"/>
<!-- resident's arm reaching out -->
