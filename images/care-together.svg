<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-labelledby="t">
<title id="t">Illustration: in a sunny living room, a caregiver sits on a low stool beside an older woman in an armchair and holds her hand in both of hers. Both are smiling. Tea and flowers sit on a small table between them.</title>
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6F1FB"/><stop offset="1" stop-color="#F5F9FD"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3E7D6"/><stop offset="1" stop-color="#EAD8C0"/></linearGradient>
  <linearGradient id="beam" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE3B3" stop-opacity=".75"/><stop offset="1" stop-color="#FFE3B3" stop-opacity="0"/></linearGradient>
  <radialGradient id="sunglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF1D6"/><stop offset="1" stop-color="#FFF1D6" stop-opacity="0"/></radialGradient>
  <radialGradient id="heartglow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFD9A0" stop-opacity=".9"/><stop offset="1" stop-color="#FFD9A0" stop-opacity="0"/></radialGradient>
  <linearGradient id="chair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B4D6F1"/><stop offset="1" stop-color="#7FB0DC"/></linearGradient>
  <linearGradient id="chairArm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9CC6E8"/><stop offset="1" stop-color="#75A8D6"/></linearGradient>
  <linearGradient id="cardigan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8CD94"/><stop offset="1" stop-color="#E5A35F"/></linearGradient>
  <linearGradient id="scrubs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A9BD8"/><stop offset="1" stop-color="#1D6AA8"/></linearGradient>
  <linearGradient id="pants" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D5E93"/><stop offset="1" stop-color="#154A75"/></linearGradient>
  <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#EDB574"/><stop offset="1" stop-color="#D4914A"/></linearGradient>
  <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCEBF7"/></linearGradient>
  <clipPath id="frame"><rect width="560" height="400" rx="28"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<!-- room -->
<rect width="560" height="400" fill="url(#wall)"/>
<rect y="300" width="560" height="100" fill="url(#floor)"/>
<rect y="296" width="560" height="6" fill="#E3D3BC"/>

<!-- window with curtains and a soft sun -->
<rect x="356" y="38" width="160" height="150" rx="12" fill="#FFFFFF"/>
<rect x="364" y="46" width="144" height="134" rx="8" fill="#D9ECFA"/>
