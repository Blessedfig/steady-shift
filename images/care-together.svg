<rect x="402" y="180" width="20" height="28" rx="9" fill="#8C5B3D"/>
<circle cx="408" cy="160" r="29" fill="#9A6646"/>
<path d="M380 160 Q376 126 410 124 Q442 126 438 160 Q434 140 412 138 Q392 140 386 166Z" fill="#2B2A33"/>
<circle cx="434" cy="134" r="14" fill="#2B2A33"/>
<path d="M386 158 q4 -4 8 0" stroke="#2B1A12" stroke-width="2.6" fill="none" stroke-linecap="round"/>
<path d="M384 172 q6 6 12 0" stroke="#2B1A12" stroke-width="2.6" fill="none" stroke-linecap="round"/>
<circle cx="398" cy="170" r="5" fill="#C9705A" opacity=".45"/>
<!-- both arms reaching to hold her hand -->
<path d="M396 230 Q330 250 284 252" stroke="#3C8CCB" stroke-width="20" stroke-linecap="round" fill="none"/>
<path d="M408 248 Q340 268 288 262" stroke="#2F7DBE" stroke-width="20" stroke-linecap="round" fill="none"/>

<!-- the hands: hers held between both of the caregiver's -->
<circle cx="292" cy="268" r="70" fill="url(#heartglow)" opacity=".55"/>
<ellipse cx="262" cy="252" rx="15" ry="11" fill="#F3CDA9"/>
<ellipse cx="278" cy="246" rx="13" ry="10" fill="#9A6646"/>
<ellipse cx="280" cy="262" rx="14" ry="10" fill="#8C5B3D"/>

<!-- heart -->
<circle cx="268" cy="196" r="26" fill="url(#heartglow)"/>
<path d="M268 212 c-17 -12 -15 -28 -3 -28 c5 0 7 3 8 6 c1 -3 3 -6 8 -6 c12 0 14 16 -3 28 l-5 4z" transform="translate(-5 0)" fill="#E9A54E"/>
</g>
</svg>
