<path d="M412 294 Q384 298 378 306 L376 334" stroke="url(#pants)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<ellipse cx="344" cy="338" rx="15" ry="6" fill="#FFFFFF"/><ellipse cx="370" cy="338" rx="15" ry="6" fill="#F4F7FA"/>
